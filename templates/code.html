<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Четырёхзначный код</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="eyebrow">{{ 'Задание 2 · После входа' if private else 'Задание 1 · Открытый доступ' }}</p>
    <h1>Ваш код</h1>
    <div class="code" aria-label="Четырёхзначный код">{{ code }}</div>
    <p class="hint">{{ 'Обновите страницу, чтобы выйти.' if private else 'Обновите страницу, чтобы получить новый случайный код.' }}</p>
    <nav><a href="{{ url_for('public_code') }}">Открытая страница</a><a href="{{ url_for('private_code') }}">Страница с входом</a></nav>
  </main>
</body>
</html>
